name: Lai Long Desk scan

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC); GitHub may delay scheduled runs a little
  workflow_dispatch: {}       # "Run workflow" button for a manual scan
  push:
    branches: [main]
    paths-ignore: ["site/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test (offline, synthetic data)
        run: python -m unittest discover -s tests -t . -v
      - name: Scan markets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m pipeline.run
      - name: Save signal journal
        run: |
          git config user.name "lai-long-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

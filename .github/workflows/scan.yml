name: Lai Long Desk scan

on:
  schedule:
    - cron: "17 * * * *"     # every hour (UTC); GitHub may delay scheduled runs a little
  workflow_dispatch: {}       # "Run workflow" button for a manual scan
  push:
    branches: [main]
    paths-ignore: ["site/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test (offline, synthetic data)
        run: python -m unittest discover -s tests -t . -v
      - name: Scan markets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m pipeline.run
      - name: Global desk data (bond curves, central banks, CFTC, macro, crypto-wide)
        continue-on-error: true
        run: python -m pipeline.global_desk
      - name: Factory (Wyckoff + MSS + volume/market profile, 4 timeframes, backtest log)
        continue-on-error: true
        run: python -m pipeline.factory
      - name: News desk data (prices, headlines, calendar)
        continue-on-error: true
        run: python -m pipeline.news_desk
      - name: System status (which sources worked this run)
        if: always()
        continue-on-error: true
        run: python -m pipeline.health
      - name: Save signal journal
        if: always()
        run: |
          git config user.name "lai-long-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          # another run may have pushed meanwhile: replay this scan's data on top (this run's files win)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null; sleep $((i * 10))
          done
          exit 1
      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: site
      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4

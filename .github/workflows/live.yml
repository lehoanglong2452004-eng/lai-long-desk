name: Lai Long Desk live data

# Every 5 minutes: quotes, headlines and the economic calendar for the news page.
# GitHub often skips 5-minute cron schedules, so the job starts hourly (that schedule is
# reliable) and refreshes every 5 minutes inside the run until the next one replaces it.
# The file goes to the `live-data` branch (one commit, replaced each time), not to main,
# so it does not fill the history and does not need a Pages deploy.
on:
  schedule:
    - cron: "3 * * * *"
    - cron: "33 * * * *"     # a second start in case the hourly one is late or dropped
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and publish live.json every 5 minutes
        run: |
          git config --global user.name "lai-long-desk-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 70 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            if timeout 240 python -m pipeline.live_desk; then
              (cd live && rm -rf .git && git init -q -b live-data && git add live.json \
                && git commit -q -m "live $(date -u +%Y-%m-%dT%H:%MZ)" \
                && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-data) \
                || echo "publish failed, retry next round"
            fi
            sleep $(( 300 - ($(date +%s) - start) > 10 ? 300 - ($(date +%s) - start) : 10 ))
          done

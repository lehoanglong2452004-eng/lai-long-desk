name: Macro desk check (branch)

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: python -m pipeline.macro_desk --force
      - name: Save sample data on the branch
        run: |
          git config user.name "lai-long-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/macro
          git commit -m "macro sample data [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

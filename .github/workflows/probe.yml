name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p probe/out && rm -f probe/out/* && python3 probe/sources.py
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe/out; git commit -m "probe results" -q; git push -q

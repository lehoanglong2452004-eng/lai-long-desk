name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf probe/out && mkdir -p probe/out && (LLD_DATA_DIR=probe/out/data timeout 1200 python3 -m pipeline.run > probe/out/run.log 2>&1; LLD_DATA_DIR=probe/out/data /usr/bin/time -v timeout 2400 python3 -m pipeline.factory > probe/out/factory.log 2>&1; LLD_DATA_DIR=probe/out/data python3 -m probe.crypto15 >> probe/out/factory.log 2>&1; true)
      - run: |
          cd probe/out/data && du -sh bars factory >> ../factory.log; ls -la bars | head -400 > ../bars_ls.txt
          find bars -type f ! -name 'BTC_*' ! -name 'EURUSD_*' ! -name 'GOLD_*' ! -name 'NVDA_*' ! -name 'SP500_*' ! -name 'index.json' -delete; rm -rf factory
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -A probe/out; git commit -m "probe results" -q; git push -q

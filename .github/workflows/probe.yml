name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/out; B=https://lehoanglong2452004-eng.github.io/lai-long-desk
          { for u in "" traditional/ traditional/trad.js traditional/engine.js data/trad/index.json data/bars/index.json data/bars/BTC_1W.json data/bars/BTC_5m.json data/bars/GOLD_1H.json data/bars/BTC_1m.json data/bars/GOLD_1m.json; do curl -s -o /dev/null -w "%{http_code} %{size_download} $u\n" "$B/$u"; done
            curl -s $B/ | grep -o 'TRUYỀN THỐNG' | head -1
            curl -s $B/data/trad/index.json | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d['assets']),d['errors'][:3],d['runtime_s']);print([a['symbol'] for a in d['assets']]);print(sum(len(v) for v in d['grid'].values()))"
            curl -s $B/data/trad/validate.json | python3 -c "import json,sys;d=json.load(sys.stdin);a=d['asset'];print('VAL',a['tested'],a['green'],a['nsig'],a['sig'][:8]);print({k:a['wf'][k] for k in ['hind','naive','sel','all']});c=d['cls'];print('CLS',c['tested'],c['green'],c['nsig'],c['sig'][:8]);print({k:c['wf'][k] for k in ['hind','naive','sel','all']})"
            curl -s $B/data/latest.json | python3 -c "import json,sys;d=json.load(sys.stdin);print('market',len(d['market']),sum(m['cls']=='crypto' for m in d['market']))"
          } > probe/out/live.txt 2>&1
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -A probe/out; git commit -m "probe live" -q; git push -q

name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/out; B=https://lehoanglong2452004-eng.github.io/lai-long-desk
          { for u in fs.js orderflow/; do curl -s -o /dev/null -w "%{http_code} %{size_download} $u\n" "$B/$u"; done
            for p in "" traditional/ midoti/ factory/ orderflow/; do echo "$p $(curl -s $B/$p | grep -c 'fs.js')"; done
          } > probe/out/live.txt 2>&1
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -A probe/out; git commit -m "probe live" -q; git push -q

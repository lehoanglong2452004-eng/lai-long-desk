name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p probe/out && rm -f probe/out/* && (LLD_GLOBAL_OUT=probe/out/global.json timeout 600 python3 -m pipeline.global_desk > probe/out/global.log 2>&1; LLD_LIVE_OUT=probe/out/live.json timeout 600 python3 -m pipeline.live_desk > probe/out/live.log 2>&1; LLD_DATA_DIR=probe/out/data timeout 1200 python3 -m pipeline.run > probe/out/run.log 2>&1; true)
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe/out; git commit -m "probe results" -q; git push -q

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MIDOTI Depth</title>
<style>*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="color-scheme" content="dark">
<style>
/* Layout: thanh công cụ (tab chế độ · mã · khung · mất cân bằng · cài đặt) · canvas (biểu đồ | DOM | lệnh khớp | profile phiên | trục giá; bên dưới là bảng phụ và trục thời gian) · bảng điều khiển nổi góc trái */
:root{
  color-scheme:dark;
  --bg:#05070a; --panel:#0c1016; --line:#1b222d; --ink:#dfe5ee; --muted:#7f8a9c;
  --buy:#22c96b; --sell:#ef4444; --dia:#22e3ff; --warn:#ffb020;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--sans);display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px 12px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.02em;color:var(--dia);margin-right:2px;white-space:nowrap}
.brand span{color:var(--ink);font-weight:500;opacity:.7}
.bar label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
select,input[type=text],input[type=number],button{font:inherit;color:var(--ink);background:#111722;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input[type=text]{width:118px;text-transform:uppercase}
input[type=number]{width:84px}
input[type=range]{width:76px;accent-color:var(--dia)}
input[type=color]{width:26px;height:26px;padding:1px;border:1px solid var(--line);border-radius:5px;background:#111722;cursor:pointer}
#cust{display:inline-flex;gap:4px}
button{cursor:pointer}
button[aria-pressed="true"]{background:#16303a;border-color:var(--dia);color:var(--dia)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--dia);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:5px 9px;font:600 12px var(--mono)}
.seg button:last-child{border-right:0}
#modes button{font:700 12.5px var(--sans);padding:5px 12px}
#modes button[aria-pressed="true"]{background:var(--dia);color:#04121a}
.imb{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}
.imbbar{width:120px;height:9px;border-radius:5px;background:var(--sell);overflow:hidden;border:1px solid #000}
.imbbar i{display:block;height:100%;width:50%;background:var(--buy);transition:width .4s}
.imb b{font:700 12px var(--mono);min-width:44px}
#menu{font-size:15px;line-height:1;padding:5px 10px}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font:600 12px var(--mono);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.live i{background:var(--buy)} .pill.demo i{background:var(--warn)}
.more{display:none;flex-basis:100%;flex-wrap:wrap;align-items:center;gap:7px 12px;padding-top:7px;border-top:1px solid var(--line)}
.bar.open .more{display:flex}
.stage{display:flex;flex:1;min-height:0}.cw{position:relative;flex:1;min-width:0}
.tools{flex:0 0 38px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.tools button{width:30px;height:30px;padding:0;display:grid;place-items:center;flex:0 0 auto}
.tools svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tools hr{width:22px;border:0;border-top:1px solid var(--line);margin:2px 0}
.tools input[type=color]{width:30px;height:30px;flex:0 0 auto}
.tools .arm{background:#3a1010;border-color:var(--sell);color:#ff9b9b}
.notein{position:absolute;width:170px;z-index:3;text-transform:none!important}
.seg select{border:0;border-radius:0;background:#111722;font:600 12px var(--mono);padding:5px 6px}
.seg select.on{background:#16303a;color:var(--dia)}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.dash{position:absolute;top:26px;left:10px;width:290px;background:rgba(5,7,10,.86);border:1px solid var(--line);border-radius:6px;padding:2px;font-size:12px;pointer-events:auto;cursor:pointer}
.dash .r{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:2px}
.dash .r:last-child{margin-bottom:0}
.dash .c{padding:4px 3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash .s5{grid-column:span 5;white-space:normal}.dash .pl{white-space:pre-line}.dash .s2{grid-column:span 2}.dash .s3{grid-column:span 3}
.dash .big{font:800 18px/1.1 var(--sans);padding:8px 4px 2px}
.dash .mono{font-family:var(--mono);font-size:11.5px}
.dash .b{font-weight:700}
.dash.mini{width:auto;min-width:128px}.dash.mini .r:not(.v){display:none}.dash.mini .big{font-size:13px;padding:6px 9px}.dash.mini .r{margin:0}
.note{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);max-width:min(560px,90%);background:#1a1407;border:1px solid var(--warn);color:#ffe2a8;padding:8px 12px;border-radius:6px;font-size:12.5px;text-align:center}
/* bố cục điện thoại: lớp .m do script gắn vào body khi màn hình hẹp hoặc thiết bị cảm ứng */
body.m .bar{gap:6px 8px;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-left:calc(10px + env(safe-area-inset-left,0px));padding-right:calc(10px + env(safe-area-inset-right,0px))}
body.m .brand span{display:none}body.m .bar label{font-size:12px}
body.m #modes{order:40;flex:1 1 100%}body.m #modes button{flex:1}
body.m #menu{order:3;padding:6px 10px}
body.m .pill{order:2;margin-left:auto;padding:5px 8px}body.m .pill span{display:none}body.m .bar.open .pill span{display:inline;font-size:10.5px}
body.m #tfs{order:50;flex-basis:100%;overflow-x:auto;scrollbar-width:none}body.m #tfs::-webkit-scrollbar{display:none}body.m #tfs button{flex:1 0 auto;padding:7px 10px}
body.m .imb{order:55;flex-basis:100%}body.m .imbbar{flex:1}
body.m .more{order:60;gap:7px 10px;max-height:42vh;overflow-y:auto}
body.m input[type=text]{width:88px}body.m input[type=range]{width:90px}body.m select,body.m button{padding:6px 8px}
body.m .dash{top:24px;left:6px;width:210px;font-size:11px}body.m .dash .big{font-size:15px}
body.m .dash.mini{width:auto;min-width:118px}body.m .dash.mini .big{font-size:12.5px;padding:6px 8px}
body.m .note{bottom:110px;font-size:12px}
@media (orientation:landscape){body.m #modes{order:1;flex:0 0 auto}body.m #tfs{order:1;flex-basis:auto;flex:1 1 160px}body.m .imb{order:1;flex:0 1 150px}}
body[data-mode=fp] #dash:not(.dock){display:none!important}
#exBtn{font-weight:700;white-space:nowrap;border-color:#2a3a4a}
.pk{position:fixed;inset:0;z-index:20;background:rgba(2,4,7,.78);display:grid;place-items:center;padding:12px}
.pk[hidden]{display:none}
.pkb{width:min(600px,100%);max-height:min(680px,94vh);display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid #263142;border-radius:10px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.pkb h2{margin:0;font:800 17px var(--sans);text-wrap:balance}.pkb h2 span{color:var(--dia)}
.pkb p{margin:0;color:var(--muted);font-size:12.5px}
.pkmsg{background:#1a1407;border:1px solid var(--warn);color:#ffe2a8!important;padding:7px 10px;border-radius:6px}
.pkex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkex button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 11px;text-align:left;border-radius:8px}
.pkex button b{font:700 14px var(--sans)}.pkex button small{color:var(--muted);font-size:11px}
.pkex button[aria-pressed="true"] small{color:var(--dia)}
.pkrow{display:flex;gap:8px;align-items:center}.pkrow input{flex:1;width:auto;min-width:0;padding:7px 9px}
.pkrow .seg button:disabled{opacity:.35;cursor:not-allowed}
.pklist{flex:1;min-height:120px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:#080b11;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));align-content:start;grid-auto-rows:max-content;gap:4px;padding:6px}
.pklist button{min-height:30px;line-height:1.3;border:1px solid transparent;background:transparent;text-align:left;font:600 12.5px var(--mono);padding:6px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pklist button:hover{background:#111722}
.pklist button[aria-pressed="true"]{background:#16303a;border-color:var(--dia);color:var(--dia)}
.pke{grid-column:1/-1;color:var(--muted);padding:14px 8px;font-size:12.5px}
.pkfoot{display:flex;align-items:center;gap:8px}.pkfoot span{flex:1;min-width:0;font:600 12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pkGo{background:var(--dia);color:#04121a;border-color:var(--dia);font-weight:800;padding:7px 16px}
@media (max-width:520px){.pkex{grid-template-columns:repeat(2,1fr)}.pkb{padding:12px}}
.dash.dock{top:auto;left:auto;right:0;bottom:0;border-radius:0;border:0;border-left:1px solid var(--line);border-top:1px solid var(--line);background:#070a0f;display:grid;grid-template-columns:236px minmax(0,1fr);gap:10px;padding:5px 8px;cursor:default;overflow:hidden;font-size:11.5px}
.dash.dock[hidden]{display:none}
.dk{display:flex;flex-direction:column;gap:4px;min-width:0}
.dk .h{display:flex;justify-content:space-between;font:700 10px var(--mono);color:var(--muted);letter-spacing:.04em}
.dk .vd{font:800 14px/1.15 var(--sans);text-align:center;padding:3px 4px;border-radius:3px}
.dk .vd small{display:block;font:500 10.5px var(--sans);opacity:.9;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk .h b{white-space:nowrap;flex:0 0 auto}
.dk .ch{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.dk .ch div{text-align:center;padding:3px 0;border-radius:2px;overflow:hidden}
.dk .ch b{display:block;font-size:9.5px}.dk .ch i{display:block;font:normal 10.5px var(--mono)}
.dk .pr{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;white-space:nowrap;min-height:17px}
.dk .pr span{color:var(--muted);flex:0 0 66px;font-family:var(--sans)}
.dk .pr .imbbar{flex:1;width:auto;height:7px}.dk .pr b{min-width:38px;text-align:right}
.dk .tr{display:grid;grid-template-columns:1fr 1fr;gap:2px}.dk .tr div{font:700 9.5px var(--sans);text-align:center;padding:2px 0;border-radius:2px;white-space:nowrap;overflow:hidden}
.dk .sg{font:10.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk .pr em{font-style:normal}.dk .g{color:#5fe39a}.dk .rd{color:#ff7b7b}
</style>

<div class="bar" id="bar">
  <div class="brand">MIDOTI ◆ <span>Depth · v1.568</span></div>
  <div class="seg" id="modes" role="group" aria-label="Chế độ xem">
    <button data-mode="heat">Heatmap</button><button data-mode="fp">Footprint</button><button data-mode="candle">Nến</button>
  </div>
  <button id="exBtn" title="Đổi sàn, loại thị trường hoặc mã" aria-haspopup="dialog">Chọn sàn ▾</button>
  <label>Mã <input type="text" id="sym" value="BTCUSDT" spellcheck="false" aria-label="Mã giao dịch theo cách viết của sàn đang chọn"></label>
  <div class="seg" id="tfs" role="group" aria-label="Khung thời gian"></div>
  <div class="imb" id="imb" title="Tỷ lệ mua chủ động so với bán chủ động trong 60 giây gần nhất"><span>Mất cân bằng</span><div class="imbbar"><i id="imbB"></i></div><b id="imbT">0%</b></div>
  <button id="menu" aria-expanded="false" aria-label="Mở hoặc đóng cài đặt" title="Cài đặt">☰</button>
  <div class="pill" id="pill"><i></i><span id="pillTxt">Đang khởi động</span></div>
  <div class="more" id="more">
    <label data-m="candle">Kiểu <select id="type"><option value="candle">Nến</option><option value="ha">Heikin Ashi</option><option value="ohlc">Thanh OHLC</option><option value="line">Đường</option><option value="area">Vùng</option></select></label>
    <label data-m="candle fp">Profile <select id="vp"><option value="visible">Vùng nhìn thấy</option><option value="day">Theo ngày</option><option value="off">Tắt</option></select></label>
    <label>Tầng giá <select id="bk"><option value="0.2">Rất mịn</option><option value="0.5">Mịn</option><option value="1" selected>Tự động</option><option value="2">Thô</option><option value="5">Rất thô</option></select></label>
    <label data-m="heat candle">Màu <select id="pal"><option value="bookmap">Bookmap</option><option value="bmwhite">Bookmap sáng</option><option value="teal">Xanh mòng két</option><option value="split">Mua xanh · Bán đỏ</option><option value="inferno">Nhiệt</option><option value="rainbow">Cầu vồng</option><option value="mono">Đơn sắc</option><option value="custom">Tự chọn</option></select><span id="cust" hidden><input type="color" id="c1" value="#1a5a8c" title="Thanh khoản thấp" aria-label="Màu thanh khoản thấp"><input type="color" id="c2" value="#ffe600" title="Thanh khoản trung bình" aria-label="Màu thanh khoản trung bình"><input type="color" id="c3" value="#ff2a00" title="Thanh khoản cao" aria-label="Màu thanh khoản cao"></span></label>
    <label data-m="heat candle">Tương phản <input type="range" id="contrast" min="0.4" max="3" step="0.1" value="1"></label>
    <label data-m="heat candle">Lọc chấm <input type="range" id="bubmin" min="0" max="3" step="0.1" value="1"></label>
    <label>Lệnh khớp <select id="tapeMin"><option value="all">Tất cả</option><option value="big" selected>Lớn</option><option value="huge">Rất lớn</option></select></label>
    <button id="tHeat" data-m="heat candle" aria-pressed="true">Heatmap</button>
    <button id="tExt" data-m="heat" aria-pressed="true" title="Phủ sổ lệnh hiện tại lên phần quá khứ chưa được ghi">Phủ quá khứ</button>
    <button id="tBub" data-m="heat candle" aria-pressed="true">Volume dots</button>
    <button id="tTape" aria-pressed="true" title="Bảng lệnh khớp cạnh cột DOM">Bảng lệnh khớp</button>
    <button id="tNum" aria-pressed="true" title="Khối lượng và giá trị tiền của các tường lệnh">Số liệu</button>
    <button id="tWall" aria-pressed="true" title="Đánh dấu các mức lệnh chờ lớn bất thường và thời gian chúng tồn tại">Tường lớn</button>
    <button id="tIce" aria-pressed="true" title="Đánh dấu mức giá bị khớp nhiều hơn hẳn lệnh chờ hiển thị (ước lượng)">Iceberg</button>
    <button id="tMid" aria-pressed="true">Lớp MIDOTI</button>
    <label title="Tự động: khung dưới H1 xem Trong ngày (OP 00:00 New York · VWAP phiên · khung lớn Tuần); từ H1 trở lên xem Swing (OP tuần · VWAP tuần · khung lớn Tháng)">Góc nhìn <select id="view"><option value="auto">Tự động</option><option value="day">Trong ngày</option><option value="swing">Swing</option></select></label>
    <label title="Vốn tài khoản dùng để tính khối lượng lệnh">Vốn $ <input type="number" id="bal" min="1" step="100"></label>
    <label title="Phần trăm vốn chấp nhận mất nếu chạm SL với tín hiệu ◆ (tối đa 2%). Tín hiệu ◇ dùng một nửa; sau 3 lệnh thua liên tiếp tự giảm còn 0,5%">Rủi ro ◆ % <input type="number" id="risk" min="0.1" max="2" step="0.1"></label>
    <button id="tSig" aria-pressed="true" title="Tín hiệu ◆/◇ của MIDOTI v1.568 kèm SL, TP1, TP2 và lệnh đang theo dõi. Chỉ là cảnh báo, không tự vào lệnh">Tín hiệu ◆</button>
    <button id="tCcry" data-m="candle" aria-pressed="true" title="Nến CCRY: xanh dương = mua có động lượng, đen = bán có động lượng, rỗng = chưa có động lượng">Nến CCRY</button>
    <button id="tVah" data-m="candle" aria-pressed="true" title="Heatmap khối lượng ĐÃ KHỚP theo tầng giá của 2 phiên gần nhất, kèm đường POC">Heatmap KL khớp</button>
    <button id="tOfl" data-m="candle" aria-pressed="true" title="Bong bóng dòng tiền: nến có RVOL ≥ 2 và mất cân bằng mua/bán ≥ 30%. ◎ = hấp thụ (khối lượng lớn nhưng thân nến nhỏ)">Bong bóng flow</button>
    <button id="tSessF" aria-pressed="true" title="Góc nhìn Trong ngày: chỉ cho tín hiệu trong phiên Á, Âu, Mỹ; luôn tránh rollover 16:55–18:05 New York và 30 phút đầu sau mốc OP">Lọc phiên</button>
    <button id="tAlert" aria-pressed="true" title="Kêu và hiện thông báo khi có ◆ mới trên nến vừa đóng">Báo ◆</button>
    <button id="tDraw" aria-pressed="true" title="Hiện hoặc ẩn thanh công cụ vẽ bên trái">Công cụ vẽ</button>
    <button id="tFollow" aria-pressed="true">Tự căn</button>
    <button id="tEco" aria-pressed="false" title="Nhận sổ lệnh chậm hơn và vẽ thưa hơn để tiết kiệm pin, dữ liệu mạng">Tiết kiệm</button>
    <button id="tWake" aria-pressed="false" title="Không để màn hình tự tắt khi đang xem">Giữ màn hình sáng</button>
  </div>
</div>
<div class="stage">
  <div class="tools" id="tools" role="toolbar" aria-label="Công cụ vẽ"></div>
  <div class="cw" id="stage">
    <canvas id="cv" aria-label="Biểu đồ MIDOTI Depth"></canvas>
    <div class="dash" id="dash" hidden></div>
    <input type="text" class="notein" id="noteIn" maxlength="80" placeholder="Ghi chú rồi nhấn Enter" hidden>
    <div class="note" id="note" hidden></div>
  </div>
</div>

<div class="pk" id="pk" hidden><div class="pkb" role="dialog" aria-modal="true" aria-labelledby="pkT">
  <h2 id="pkT"><span>MIDOTI ◆</span> Chọn nguồn dữ liệu</h2>
  <p>Chọn sàn cung cấp sổ lệnh và lệnh khớp. Mọi chỉ báo và công cụ của MIDOTI chạy giống nhau trên sàn nào cũng vậy.</p>
  <p class="pkmsg" id="pkMsg" hidden></p>
  <div class="pkex" id="pkEx" role="group" aria-label="Sàn"></div>
  <div class="pkrow"><div class="seg" id="pkMk" role="group" aria-label="Loại thị trường"><button data-mk="fut">Futures</button><button data-mk="spot">Spot</button></div><input type="text" id="pkQ" placeholder="Tìm mã, ví dụ BTC" spellcheck="false" aria-label="Tìm mã"></div>
  <div class="pklist" id="pkList"></div>
  <div class="pkfoot"><span id="pkSel"></span><button id="pkX">Đóng</button><button id="pkGo">Vào chart</button></div>
</div></div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
const C={bg:'#05070a',line:'#1b222d',ink:'#dfe5ee',muted:'#7f8a9c',buy:'#22c96b',sell:'#ef4444',bid:'#19b56b',ask:'#e5484d',dia:'#22e3ff',vwap:'#ffc233',op:'#ff8a3d',mlp:'#c77dff',lvl:'#8a93a6',warn:'#ffb020',vp:'#1aa7c4',poc:'#ff3df2',neu:'#5e6676',mb:'#3d7bff',ms:'#ff4d5e',good:'#2bd48a'};

function rank(id){const u=nrm(id),B=['BTC','ETH','SOL','XRP','BNB','DOGE','XAU','PAXG'];let b=B.findIndex(x=>u.startsWith(x));if(b<0)b=50;return b*10+(/USDT(SWAP)?$/.test(u)?0:/USD(SWAP)?$/.test(u)?1:/USDC(SWAP)?$/.test(u)?2:5)}
function pkCards(){$('pkEx').innerHTML=EXL.map(k=>{const d=k==='demo';return '<button data-ex="'+k+'" aria-pressed="'+(P.ex===k)+'"><b>'+(d?'Mô phỏng':EX[k].name)+'</b><small>'+(d?'Dữ liệu giả để xem giao diện':EX[k].mk.map(m=>MKL[m]).join(' · '))+'</small></button>'}).join('');
  const mk=P.ex==='demo'?[]:EX[P.ex].mk;document.querySelectorAll('#pkMk button').forEach(b=>{b.disabled=!mk.includes(b.dataset.mk);b.setAttribute('aria-pressed',b.dataset.mk===P.mkt&&!b.disabled)});$('pkQ').disabled=P.ex==='demo'}
function pkSel(){$('pkSel').textContent=P.ex==='demo'?'Mô phỏng':EX[P.ex].name+' · '+MKL[P.mkt]+' · '+(P.sym||'chưa chọn mã')}
function pkList(){const c=symCache[P.ex+'|'+P.mkt],ls=$('pkList');if(!c)return;const q=nrm($('pkQ').value),it=c.a.filter(id=>!q||nrm(id).includes(q)).slice(0,180);
  ls.innerHTML=(c.ok?'':'<div class="pke">Không tải được danh sách mã từ sàn, đang hiện các mã phổ biến. Có thể gõ đúng mã của sàn vào ô tìm rồi bấm "Vào chart".</div>')+(it.length?it.map(id=>'<button data-sym="'+id+'" aria-pressed="'+(id===P.sym)+'">'+id+'</button>').join(''):'<div class="pke">Không có mã nào khớp.</div>');pkSel()}
async function pkLoad(){pkCards();const ex=P.ex,mkt=P.mkt,key=ex+'|'+mkt,tok=++pkTok,ls=$('pkList');if(P.ex==='demo'){P.sym='';ls.innerHTML='<div class="pke">Dữ liệu giả lập chạy ngay trên máy, không cần kết nối sàn và không cần chọn mã.</div>';pkSel();return}
  if(!symCache[key]||!symCache[key].ok){ls.innerHTML='<div class="pke">Đang tải danh sách mã từ '+EX[ex].name+'…</div>';let c;try{const a=await EX[ex].symbols(mkt);if(!a.length)throw 0;c={a:[...new Set(a)].sort((x,y)=>rank(x)-rank(y)||(x<y?-1:1)),ok:true}}catch(e){c={a:EX[ex].fb[mkt].slice(),ok:false}}if(tok!==pkTok)return;symCache[key]=c}
  const c=symCache[key],sv=S.syms[key];P.sym=sv&&(c.a.includes(sv)||!c.ok)?sv:c.a[0];pkList()}
function setEx(ex){P.ex=ex;if(ex!=='demo'&&!EX[ex].mk.includes(P.mkt))P.mkt=EX[ex].mk[0];$('pkQ').value='';pkLoad()}
function openPicker(msg){P={ex:S.src==='demo'?'demo':S.ex,mkt:S.mkt,sym:''};$('pkMsg').hidden=!msg;$('pkMsg').textContent=msg||'';$('pkX').hidden=!running||!!msg&&!live;$('pk').hidden=false;setEx(P.ex)}
function pkGo(){if(P.ex==='demo')S.src='demo';else{const typed=$('pkQ').value.trim().toUpperCase(),c=symCache[P.ex+'|'+P.mkt],sym=P.sym&&(!typed||nrm(P.sym).includes(nrm(typed)))?P.sym:typed;if(!sym)return;S.src='live';S.ex=P.ex;S.mkt=P.mkt;S.sym=sym;S.syms[P.ex+'|'+P.mkt]=sym;$('sym').value=sym}
  $('pk').hidden=true;running=true;retry=0;exLabel();save();start()}
$('pkEx').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setEx(b.dataset.ex)});
$('pkMk').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled){P.mkt=b.dataset.mk;pkLoad()}});
$('pkList').addEventListener('click',e=>{const b=e.target.closest('button');if(b){P.sym=b.dataset.sym;pkList()}});$('pkList').addEventListener('dblclick',e=>{if(e.target.closest('button'))pkGo()});
$('pkQ').addEventListener('input',()=>{const c=symCache[P.ex+'|'+P.mkt];if(c){const q=nrm($('pkQ').value),f=c.a.find(id=>nrm(id).includes(q));if(f)P.sym=f}pkList()});$('pkQ').addEventListener('keydown',e=>{if(e.key==='Enter')pkGo();e.stopPropagation()});
$('pkGo').addEventListener('click',pkGo);$('pkX').addEventListener('click',()=>{$('pk').hidden=true});$('exBtn').addEventListener('click',()=>openPicker(''));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('pk').hidden&&!$('pkX').hidden)$('pk').hidden=true});
if(!EX[S.ex])S.ex='binance';exLabel();
requestAnimationFrame(draw);openPicker('');
})();
</script>
</body>
</html>
